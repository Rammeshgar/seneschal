<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" role="img" aria-labelledby="title description">
  <title id="title">Seneschal — your private AI atelier</title>
  <desc id="description">A dark architectural launch graphic for Seneschal, a local-first OpenCode workspace for Windows and WSL.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#05070b"/><stop offset="1" stop-color="#0d171b"/></linearGradient>
    <linearGradient id="signal" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#57e6d9"/><stop offset=".58" stop-color="#8bb8ff"/><stop offset="1" stop-color="#ffb45e"/></linearGradient>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse"><path d="M44 0H0V44" fill="none" stroke="#33423a" opacity=".22"/></pattern>
    <filter id="shadow"><feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000" flood-opacity=".45"/></filter>
  </defs>
  <rect width="1280" height="640" fill="url(#bg)"/>
