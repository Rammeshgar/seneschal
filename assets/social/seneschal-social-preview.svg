  <text x="190" y="145" fill="#7f918b" font-family="ui-monospace,Consolas,monospace" font-size="13" font-weight="700" letter-spacing="3">YOUR PRIVATE AI ATELIER</text>
  <text x="76" y="264" fill="#f3f6f5" font-family="Inter,Segoe UI,sans-serif" font-size="64" font-weight="780" letter-spacing="-2">One calm workspace.</text>
  <text x="76" y="332" fill="#f3f6f5" font-family="Inter,Segoe UI,sans-serif" font-size="64" font-weight="780" letter-spacing="-2">Models, tools, and control.</text>
  <text x="80" y="386" fill="#9db39f" font-family="Inter,Segoe UI,sans-serif" font-size="23">A local-first OpenCode interface for Windows + WSL.</text>
