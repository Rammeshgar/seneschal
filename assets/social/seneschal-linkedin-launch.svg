<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 627" role="img" aria-labelledby="title description">
  <title id="title">Introducing Seneschal</title>
  <desc id="description">LinkedIn launch artwork for Seneschal, a private local-first AI workspace powered by OpenCode.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#05070b"/><stop offset="1" stop-color="#0c171a"/></linearGradient>
